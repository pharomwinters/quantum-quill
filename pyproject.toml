[project]
name = "vault"
version = "0.1.0"
description = "Schema validator for a typed personal information manager"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
vault = "vault.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vault"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
