# =============================================================================
#  TYPES — the schema half of the typed PIM
# =============================================================================
#
#  Folder-layout.yaml says WHERE a record lives. This file says WHAT it is.
#
#  A record is a markdown file: frontmatter is the data, the body is whatever
#  prose belongs with it. For a note the body is the point; for a document the
#  body is commentary and `file:` points at the payload beside it.
#
#  Every record carries a permanent `id` slug. Links point at ids, so renaming,
#  retitling, moving and archiving never break a reference. Postgres holds the
#  records and a projector renders them back out as markdown — see
#  docs/design — but this file is the specification both are built to and is
#  owned by neither.
#
#  67 type names in the layout collapse here to 14 core types and 82 subtype
#  values. Adding a new kind of document is a vocabulary edit, not a schema
#  change.
#
# =============================================================================

meta:
  name: vault
  version: 1
  updated: 2026-08-19
  companion: Folder-layout.yaml

# -----------------------------------------------------------------------------
#  PROVENANCE — how much of this file is evidence and how much is a bet
# -----------------------------------------------------------------------------
#
#  The schema was written before most of the material it describes exists, so
#  it does not carry uniform authority and should not pretend to. Every type,
#  vocabulary and state machine is marked, so the parts worth holding loosely
#  are visible without re-deriving which is which.

provenance_levels:
  derived: >
    Real material CONTRADICTED the original design and changed it. Strongest
    evidence — the schema is shaped by the data rather than merely compatible
    with it.
  confirmed: >
    Real material exercised it and it held unchanged. Good evidence, but note
    that surviving is weaker than correcting: it may only mean the material
    never pushed hard enough.
  provisional: >
    No real instance. An informed bet, uncontradicted because untested.
    Expect it to be wrong in ways nothing here can predict.

provenance_review:
  trigger: first-instance
  rule: >
    When the first real record of a provisional type is created, or the first
    real use of a provisional vocabulary value, re-read that definition
    against it before creating a second. That is the cheapest moment to be
    wrong, and the only reliable one.

# -----------------------------------------------------------------------------
#  CONVENTIONS
# -----------------------------------------------------------------------------

conventions:
  record_file: "{title}.md"
  dated_record_file: "{date} {title}.md" # journal, meeting, document
  container_record_file: "{title}.md" # inside its own folder

  id_derivation: >
    slugify(title) at creation. On collision, append the record's primary date,
    then an incrementing suffix. Once written the id is immutable — retitling a
    record leaves it alone, which is the whole point.

  body: >
    Everything below the frontmatter. Never parsed for data. A record with an
    empty body is valid; a record with no frontmatter is not a record.

# -----------------------------------------------------------------------------
#  FIELD TYPES
# -----------------------------------------------------------------------------

field_types:
  text: Single line of plain text.
  longtext: Multi-line prose. Markdown permitted.
  slug: A kebab-case identifier. Used for `id` and for link targets.
  date: Calendar date, YYYY-MM-DD. No time component, no timezone.
  datetime: Instant, ISO 8601 with offset.
  number: Integer or decimal.
  money: Decimal amount plus a currency code.
  bool: true / false.
  enum: One value from a named closed vocabulary. Declared with `of:`.
  link: Reference to another record by id. Constrained with `to:`.
  folder: Reference to a folder id from Folder-layout.yaml.
  file: Relative path to a binary sitting in the same folder as the record.
  list: Repeated values of a single type. Declared as `list[<type>]`.
  union: >
    Two or more permitted types, written as a list. Used where a field is
    migrating from one representation to another — see `person.organization`.

# -----------------------------------------------------------------------------
#  UNIVERSAL FIELDS — present on every record of every type
# -----------------------------------------------------------------------------

universal:
  - key: id
    type: slug
    required: true
    immutable: true
    description: >
      Permanent identity. Generated once at creation and never changed by any
      operation, including retitling, moving and archiving.

  - key: type
    type: enum
    of: core_type
    required: true
    description: One of the twelve core types below.

  - key: title
    type: text
    derived_from: filename
    description: >
      Display name, taken from the filename. NOT a required frontmatter field:
      0 of 129 real records carried one, because in a file-based system the
      filename already is the title, and demanding a copy creates two sources
      of truth that drift. Present in frontmatter only as a deliberate
      override. Free to change; `id` does not follow it.

  - key: body
    type: longtext
    description: >
      Everything below the frontmatter — see `conventions.body`. Declared as a
      field because it is one: the query contract full-text indexes it, and a
      store that is not a file has to give it somewhere to live. It was
      omitted only because in a file-based system the body was whatever the
      frontmatter was not, and so needed no declaration. Never parsed for
      data; an empty body is valid.

  - key: created
    type: datetime
    required: true
    system: true
    description: >
      Stamped at creation. Never hand-edited. An instant rather than a date:
      a file-based vault was written by hand a few times a day, and a service
      writes whenever it is asked to. `date` could not order two records made
      the same afternoon.

  - key: updated
    type: datetime
    system: true
    description: >
      Stamped on write. An instant, for the same reason as `created` — and
      more sharply, since "what changed since I last looked" is a question
      about an afternoon, not about a day.

  # `created` and `updated` were widened from `date` on 2026-08-19, before any
  # SQL existed, because the store stopped being a filesystem. The two other
  # system-stamped dates deliberately did NOT follow: nothing asks when in the
  # day a task was finished, and 24 real tasks already carry a date-only
  # `completedDate`.
  - key: archived_on
    type: date
    system: true
    description: >
      Set when the record is archived; null means live. Deliberately separate
      from any type's `status`: archiving is a universal operation about
      location and attention, while status is domain state. A project can be
      `done` and not yet archived, and a person can be archived without ever
      having had a status at all — which is why every area has a 9N
      counterpart but only five types have a state machine.

  - key: related
    type: "list[link]"
    to: "*"
    inverse: related
    symmetric: true
    description: >
      Untyped association to any other record. The escape hatch — when a
      connection has no more specific field, it goes here. Its own inverse:
      if A is related to B, B is related to A, and the index makes the
      reverse edge visible without it being written into B's file.

  - key: tags
    type: list[text]
    description: >
      Free-form labels. Deliberately unvalidated: the closed vocabularies
      carry the meaning, and tags carry everything not worth formalising.

# -----------------------------------------------------------------------------
#  ROUTING — which folder a record belongs in
# -----------------------------------------------------------------------------
#
#  Types do not name folders. Folder-layout.yaml already declares `types:` per
#  category, listing SUBTYPE values, so the routing table is that file read in
#  reverse. Two types route on something other than a subtype and declare it
#  explicitly here.

routing:
  derived_from_layout:
    types: [document, resource, note, system, journal, meeting, task, person, organization, group, world]
    rule: >
      Look up the record's subtype value (or, for types with no subtype, the
      type id) in the layout's category `types:` lists. Exactly one category
      must match. Zero matches or more than one is a schema defect, not a
      record defect — validate the two files against each other, not the note.

  explicit:
    - type: project
      routes_by: scope
      map:
        work: work-projects
        personal: personal-projects
        creative: creative-projects

    - type: area
      routes_by: id
      rule: >
        An area record's id must equal the id of a category in area 20-29, and
        it lives inside that category. The record IS the description of the
        responsibility the folder holds.

    - type: document
      when: attaches_to is set
      routes_by: attaches_to
      relative_to: container
      rule: >
        A document attached to a project, area or world lives inside that
        container's folder rather than its doc_type category. With
        `attaches_to` empty it routes normally by doc_type. 63 of 114 real
        binaries are already filed this way, and moving them into 30-39
        would separate a PFMEA from the project it analyses.

    - type: world-entry
      routes_by: appears_in
      relative_to: container
      rule: >
        Entries live inside the folder of the world they appear in — a
        container-relative destination rather than a category. The world is a
        container record under 13 Creative Projects; its entries sit beneath
        it, optionally grouped into subfolders by entry_type. This is the one
        routing shape that resolves against another record instead of against
        Folder-layout.yaml.

# -----------------------------------------------------------------------------
#  CONTAINERS
# -----------------------------------------------------------------------------
#
#  Two types own a folder rather than merely sitting in one. The record's id
#  and the folder's id are the same string, so archiving moves both and every
#  inbound reference survives untouched.

containers:
  types: [project, area, world]
  rule: >
    A container record lives at the root of the folder it names. Its id must
    equal that folder's id in Folder-layout.yaml. Everything else in the tree
    is a plain file.

# -----------------------------------------------------------------------------
#  CORE TYPES
# -----------------------------------------------------------------------------

types:
  # ===========================================================================
  - id: project
    name: Project
    kind: container
    subtype: null
    provenance: derived
    evidence:
      records: 4
      changed: ["outcome -> result", "kept start/end over project_start/project_end"]
      gap: "scope missing on 4 of 4 — a required field nothing has"
    description: >
      A short-term effort with a deadline and a definition of done. If it
      cannot finish, it is an area.
    fields:
      - { key: status, type: enum, of: project_status, required: true }
      - { key: scope, type: enum, of: scope, required: true }
      # Real projects use `project_start` / `project_end`. That prefix only
      # existed to dodge a flat frontmatter namespace shared by every type —
      # a tool artifact, not a distinction — so the schema drops it.
      - { key: start, type: date }
      - { key: end, type: date }
      - key: result
        type: longtext
        description: >
          Written at completion, not at creation. An empty result on a
          finished project is the single most common thing worth chasing.
          Named `result` because 4 of 4 real projects and 14 of 14 real
          meetings already call it that, and there is no principled reason
          to prefer the word I invented.
      - { key: serves, type: "list[link]", to: area, inverse: projects }

  # ===========================================================================
  - id: area
    name: Area of Responsibility
    kind: container
    subtype: null
    provenance: provisional
    evidence:
      records: 0
      note: >
        PARA's Areas do not exist in any real material. Seven categories in
        20-29 and a three-state machine, all invented. The most speculative
        type in the file.
    description: >
      An ongoing responsibility with a standard to maintain and no end date.
      Areas own no documents; documents in 30-39 point AT them via `serves`.
    fields:
      - key: status
        type: enum
        of: area_status
        required: true
        description: >
          Areas do end — a property sold, a matter closed, a dependant grown.
          The layout has always had `92 Archived Areas`; the type had no way
          to get there. Found by writing the lifecycle rules, not by design.
      - key: standard
        type: longtext
        required: true
        description: >
          What "maintained" means for this area, in a sentence. Required
          because an area without a standard is just a folder name.
      - { key: review_cadence, type: enum, of: cadence }

  # ===========================================================================
  - id: document
    name: Document
    kind: payload
    subtype: doc_type
    provenance: derived
    evidence:
      records: 0
      binaries: 114
      changed: ["definition widened from 'about you' to 'about you or by you'",
                "+attaches_to, +supersedes, +snapshot_of",
                "+6 doc_types, +category 39"]
      note: >
        Derived from binaries, not from records — no document record has ever
        existed. The SHAPE is evidence-backed; the field semantics are not.
    description: >
      A file with metadata — issued TO you or produced BY you. The binary is
      the payload; the markdown carries the metadata and any commentary.

      The original definition said "a record about you", which a survey of 114
      real binaries broke immediately: 63 of them are work products — PFMEA
      analyses, trackers, SAP exports, amp-hour reports — with exactly the
      same shape (date, author, revision, supersession) and none of the eight
      personal categories able to hold them. The shape was right; the
      definition was too narrow.
    fields:
      - key: file
        type: file
        required: true
        description: Relative path to the payload, in the same folder.
      - { key: doc_type, type: enum, of: doc_type, required: true }
      - { key: doc_date, type: date, required: true }
      - key: attaches_to
        type: link
        to: [project, area, world]
        inverse: filed_here
        description: >
          The container this document belongs to. When set, the document
          lives inside that container's folder rather than its doc_type
          category — which is where 63 of 114 real binaries already sit.
      - { key: issuer, type: link, to: [organization, person], inverse: issued }
      - { key: party, type: "list[link]", to: [organization, person], inverse: documents }
      - key: revision
        type: text
        description: >
          Text, not a number — engineering rev letters ("Rev C") and dotted
          versions ("2.1") both have to work.
      - { key: status, type: enum, of: doc_status }
      - key: supersedes
        type: link
        to: document
        inverse: superseded_by
        description: >
          The revision this one replaces. Chains a version history without
          encoding it in filenames.
      - key: snapshot_of
        type: link
        to: document
        inverse: snapshots
        description: >
          Marks this file as a point-in-time backup of another document
          rather than a revision in its own right. 10 of the 14 real PFMEA
          files are exactly this — "backup before guide columns", "backup
          before severity guide" — and counting them as revisions would
          inflate a four-revision history into fourteen.
      - { key: serves, type: "list[link]", to: area, inverse: documents }

  # ===========================================================================
  - id: resource
    name: Resource
    kind: reference
    subtype: resource_type
    provenance: derived
    evidence:
      records: 29
      changed: ["+plan subtype for implementation-plan/improvement-plan x5"]
      open: >
        3 real resources carry a `status` (stub, in-progress, done) that this
        type has no field for. Unresolved — see `open_questions`.
    description: >
      Reference material — something you consult. Nothing here is dated
      evidence and nothing here is irreplaceable. If it has a party and a
      signature, it is a document.
    fields:
      - { key: resource_type, type: enum, of: resource_type, required: true }
      - { key: source, type: text }
      - { key: url, type: text }
      - { key: topic, type: "list[text]" }

  # ===========================================================================
  - id: person
    name: Person
    kind: people
    subtype: null
    provenance: derived
    evidence:
      records: 15
      changed: ["dropped full_name", "relationship required -> required-on-create",
                "organization widened to link|text"]
      note: >
        The type that changed most under testing, and the only one that now
        conforms outright. Before those three edits it failed 15 of 15.
    description: One record per human.
    fields:
      - key: relationship
        type: "list[enum]"
        of: relationship
        required: on-create
        description: >
          Multi-valued. The field that earned Contacts a cross-cutting area —
          a colleague you also know socially is both, and asking for it is
          what stops the distinction degrading back into folders. Required
          when creating a record, but only a WARN on records that predate the
          schema: 0 of 15 real person notes carry it, and 15 judgment calls
          is a backfill task, not an import blocker.
      - { key: email, type: "list[text]" }
      - { key: phone, type: "list[text]" }
      - key: organization
        type: [link, text]
        to: organization
        inverse: people
        description: >
          A link once the organisation has a record of its own, plain text
          until then. All 15 real person notes store the employer as a string
          and no organization record exists anywhere, so demanding a link
          would block every single import.
      - { key: role, type: text }
      - { key: met, type: date }

  # ===========================================================================
  - id: organization
    name: Organization
    kind: people
    subtype: null
    provenance: provisional
    evidence:
      records: 0
      note: >
        Zero organization records exist, yet 15 person records name an
        employer as text and six link fields point here. The first real one
        will decide whether this type is right; until then every inverse on
        it is theoretical.
    description: A company, institution, vendor or practice.
    fields:
      - { key: org_type, type: enum, of: org_type }
      - { key: website, type: text }
      - { key: industry, type: text }

  # ===========================================================================
  - id: group
    name: Group
    kind: people
    subtype: null
    provenance: provisional
    evidence: { records: 0 }
    description: >
      A named, persisting collection of people — a team, a household, a
      committee. A record with members, not a folder of person files.
    fields:
      - { key: members, type: "list[link]", to: person, required: true, inverse: groups }
      - { key: purpose, type: text }

  # ===========================================================================
  - id: note
    name: Note
    kind: written
    subtype: note_type
    provenance: confirmed
    evidence:
      records: 18
      note: >
        Held unchanged. `note_type` was missing on 17 of 18, but a constant
        default resolved it without touching the type — friction at import,
        not a defect in the shape.
    description: >
      Written by you, not dated, not a meeting, not a task. The default
      destination for anything that does not obviously belong elsewhere.
    fields:
      - { key: note_type, type: enum, of: note_type, required: true }
      - key: source
        type: link
        to: resource
        inverse: notes
        description: >
          For literature notes — the material being read. Authorship is the
          line: theirs in 43/46, yours here.

  # ===========================================================================
  - id: journal
    name: Journal Entry
    kind: written
    subtype: period
    provenance: derived
    evidence:
      records: 6
      changed: ["+period subtype — the type could not represent a weekly at all"]
    description: >
      A dated entry. The date IS the identity, so capture requires no title
      and no filing decision. Daily and weekly are ONE type with different
      periods — the old vault made them two separate types only because it
      had no subtype mechanism, which is a tool artifact rather than a real
      distinction.
    fields:
      - { key: period, type: enum, of: period, required: true }
      - key: date
        type: date
        required: true
        unique: true
        description: >
          The anchor date. For a weekly, the Monday the week starts on.

  # ===========================================================================
  - id: meeting
    name: Meeting
    kind: written
    subtype: null
    provenance: derived
    evidence:
      records: 14
      changed: ["outcome -> result"]
      gap: "`date` missing on 14 of 14 — real meetings only carry `created`"
    description: >
      Notes from a conversation with other people. Attendees are links, so a
      person's meeting history assembles itself with no extra bookkeeping.
    fields:
      - { key: date, type: date, required: true }
      - { key: attended, type: "list[link]", to: person, required: true, inverse: meetings }
      - { key: agenda, type: longtext }
      - { key: result, type: longtext }

  # ===========================================================================
  - id: task
    name: Task
    kind: written
    subtype: null
    provenance: derived
    evidence:
      records: 30
      changed: ["project -> projects (list)", "+deferred state"]
      confirms: >
        `completed` was invented while writing the lifecycle rules, before
        any task had been examined. 24 of 30 real tasks already carry
        `completedDate`. The rare case of a bet arriving pre-validated.
    description: >
      One record per task, held centrally rather than filed under a project —
      a task links to its project, and location would only duplicate what the
      link already says. Tasks routinely serve more than one.

      Import note: the 30 real tasks are identified by a `#task` TAG and carry
      no `type` field at all. Import stamps `type: task` from the tag; a
      tagged file with no type is an import candidate, not a defect.
    fields:
      - { key: state, type: enum, of: task_state, required: true }
      - { key: priority, type: enum, of: priority }
      - { key: due, type: date }
      - { key: scheduled, type: date }
      - key: completed
        type: date
        system: true
        description: >
          Stamped on the transition into `done`. Without it "what did I finish
          last week" is unanswerable, since `updated` moves on every edit.
      - key: projects
        type: "list[link]"
        to: project
        inverse: tasks
        description: >
          Plural. Real tasks already carry a `projects` list — a task raised
          in a meeting commonly serves both the meeting's project and its
          own, and a single link would force a choice reality does not make.
      - { key: blocked_by, type: "list[link]", to: task, inverse: blocks }

  # ===========================================================================
  - id: world
    name: World
    kind: container
    subtype: null
    provenance: confirmed
    evidence:
      records: 1
      note: >
        One record. "Confirmed" on a sample of one is barely a claim — the
        creative side was planned and never built.
    description: >
      A fictional setting. A container like a project, and it lives among the
      creative projects because that is where the real one already lives —
      but it is not a project: it has no deadline and never finishes.
    fields:
      - { key: status, type: enum, of: project_status, required: true }
      - { key: setting, type: longtext }

  # ===========================================================================
  - id: world-entry
    name: World Entry
    kind: written
    subtype: entry_type
    provenance: confirmed
    evidence:
      records: 1
      note: >
        One entry (a polity) against 23 declared entry_types. The vocabulary
        came from template filenames, not from entries — so the TYPE held,
        while 22 of its 23 values remain untested.
    description: >
      One element of a fictional setting — a character, a polity, a deity, a
      region. Not a note: an entry has an in-world existence, belongs to
      exactly one world, and is one of a closed set of kinds. Collapsing the
      23 kinds into freeform tags would make "every deity in Empire"
      unanswerable and leave nothing to validate.
    fields:
      - { key: entry_type, type: enum, of: entry_type, required: true }
      - key: appears_in
        type: link
        to: world
        required: true
        inverse: entries
        description: >
          The world this entry belongs to. Also its routing key — entries
          live inside their world's folder.

  # ===========================================================================
  - id: system
    name: System Artifact
    kind: system
    subtype: system_type
    provenance: provisional
    evidence:
      records: 0
      note: "The app that would create these does not exist yet."
    description: >
      The app's own furniture — saved views, record templates, generated
      reports. Lives in 00-09 and is never personal content.
    fields:
      - { key: system_type, type: enum, of: system_type, required: true }

# -----------------------------------------------------------------------------
#  VOCABULARIES
# -----------------------------------------------------------------------------
#
#  Every one is closed: a value outside its list is an ERROR. Subtype values
#  may declare `adds:` — fields that exist only for that subtype.

vocabularies:
  # --- the type register itself ------------------------------------------
  core_type:
    provenance: derived
    evidence: "grew 12 -> 14; world and world-entry added by real records"
    closed: true
    values: [project, area, document, resource, person, organization, group,
             note, journal, meeting, task, world, world-entry, system]

  # --- shared enums ------------------------------------------------------
  scope:
    provenance: provisional
    evidence: "1 use across 129 records, and missing on all 4 real projects"
    closed: true
    values: [work, personal, creative]

  project_status:
    provenance: confirmed
    evidence: "active x4. Only one of the four values has ever been used."
    closed: true
    values: [active, on-hold, done, cancelled]

  doc_status:
    provenance: provisional
    evidence: { records: 0 }
    closed: true
    values: [active, superseded, archived]

  area_status:
    provenance: provisional
    evidence: { records: 0 }
    closed: true
    values: [active, dormant, closed]
    note: >
      Not `project_status`. An area cannot be "done" — that is what makes it
      an area. It can go quiet (dormant) or genuinely end (closed).

  task_state:
    provenance: derived
    evidence: "done x24, deferred x4, in-progress x2; `deferred` added"
    closed: true
    values: [open, in-progress, blocked, deferred, done, cancelled]
    note: >
      `deferred` added by evidence — 4 of 30 real tasks use it, and it is
      genuinely distinct from both blocked (something else is in the way) and
      cancelled (never happening). Real usage is done x24, deferred x4,
      in-progress x2; `open`, `blocked` and `cancelled` are unattested,
      `open` presumably because it is the unwritten default.

  priority:
    provenance: provisional
    evidence: "the field is used on real tasks; its values were not surveyed"
    closed: true
    values: [low, normal, high]

  cadence:
    provenance: provisional
    evidence: { records: 0 }
    closed: true
    values: [weekly, monthly, quarterly, annually]

  relationship:
    provenance: provisional
    evidence: "0 of 15 person records carry it — the whole vocabulary is a bet"
    closed: true
    multi: true
    values: [family, friend, colleague, client, vendor, acquaintance, professional]

  org_type:
    provenance: provisional
    evidence: { records: 0 }
    closed: true
    values: [employer, client, vendor, institution, practice, other]

  # --- subtype: document -------------------------------------------------
  doc_type:
    parent: document
    provenance: derived
    evidence:
      binaries: 114
      confirmed_values: [spec, paystub, resume, cover-letter, offer-letter,
                         claim, medical-record, insurance-policy, correspondence]
      added_values: [quote, certificate, analysis, dataset, report, register]
      note: >
        9 of 35 values confirmed by real files, 6 added by them, and the
        remaining 20 provisional. Treat any unlisted value as a bet.
    closed: true
    values:
      # 31 Identity & Vital Records
      - id: identity-document
        name: Identity Document
      - id: vital-record
        name: Vital Record

      # 32 Income & Employment
      - id: paystub
        name: Paystub
        adds:
          - { key: gross, type: money }
          - { key: net, type: money }
          - { key: pay_period, type: text }
      - id: w2
