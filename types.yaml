      - { id: audit, name: Audit Report } # 05

# -----------------------------------------------------------------------------
#  DOCUMENT STUBS
# -----------------------------------------------------------------------------

stubs:
  policy: opt-in
  rationale: >
    Binaries are indexed by path, filename and embedded metadata whether or
    not a stub exists, so nothing is ever unfindable. A stub is created when
    you actually want fields on a file. Twelve real records beat a hundred
    and twenty empty ones.

  bulk_assist:
    description: >
      Where a directory of binaries carries parseable filenames, offer to
      generate stubs for the batch with the parsed fields pre-filled. Always
      previewed before writing, never automatic.
    example:
      pattern: "{doc_date} {issuer} Paystub.pdf"
      produces: { type: document, doc_type: paystub, doc_date: parsed, issuer: parsed }

  never_stub:
    - reason: Sensitive folders are metadata-only by layout rule.
      folders: [identity-vital, insurance-medical, legal-correspondence]
      note: >
        Stubs may be authored by hand here, but never generated in bulk and
        never from parsed content.

# -----------------------------------------------------------------------------
#  LIFECYCLE — legal transitions, what they require, and what they DO
# -----------------------------------------------------------------------------
#
#  Everything above describes a record at rest. This describes how it changes.
#  Without it, each of `archiving preserves the key`, `an empty result on a
#  finished project is worth chasing` and `a superseded document points at its
#  successor` lives only in prose, and two implementations could honour them
#  differently while both claiming to match the schema.

lifecycle:
  principle: >
    A transition is legal, required-complete, and effectful. Guards may block
    or merely warn — the distinction matters, because a project with three
    open tasks is usually finishable and occasionally a mistake, and the
    schema should say which without deciding for you.

  # --- the universal operation -------------------------------------------
  archive:
    applies_to: "*"
    trigger: explicit, or automatic on entering a terminal state
    effects:
      - stamp: archived_on
      - move_to: "9N — the archive category mirroring the source area"
      - preserve: [id, jd]
      - keep: inverses
    rules:
      - >
        The id never changes. Every inbound link survives archiving, which is
        the entire payoff of slug keys over path or title identity.
      - >
        Inbound links stay valid but raise `link-to-archived-record` as a
        WARN, so a live record depending on an archived one is visible
        without being forbidden.
      - >
        Container contents move WITH their container. A document with
        `attaches_to` set lives inside the container's folder, so archiving a
        project carries its documents automatically — no cascade needed,
        because location already encodes the relationship.
    reversible: true
    unarchive: clears archived_on, restores to the mirrored source category

  # --- state machines ----------------------------------------------------
  machines:
    - type: project
      field: status
      provenance: provisional
      evidence: >
        All 4 real projects are `active`. Not one transition has ever
        happened, so every rule below is untested — including the guard that
        counts open tasks.
      initial: active
      terminal: [done, cancelled]
      transitions:
        - { from: active, to: on-hold }
        - { from: on-hold, to: active }
        - from: active
          to: done
          requires: [result, end]
          guards:
            - check: "tasks where state in [open, in-progress, blocked] is empty"
              severity: warn
              message: "{n} task(s) still open on this project"
              note: >
                Uses the `tasks` inverse from the query contract. A warn, not
                a block — finishing a project with loose ends is a real and
                usually deliberate act.
          effects: [archive]
        - from: [active, on-hold]
          to: cancelled
          requires: [result]
          effects: [archive]
        - { from: [done, cancelled], to: active, note: "reopening; clears archived_on" }

    - type: area
      field: status
      provenance: provisional
      evidence: "0 records. Both the field and the machine were invented here."
      initial: active
      terminal: [closed]
      transitions:
        - { from: active, to: dormant }
        - { from: dormant, to: active }
        - from: [active, dormant]
          to: closed
          guards:
            - check: "projects where status == active is empty"
              severity: error
              message: "cannot close an area with active projects"
              note: >
                An ERROR rather than a warn, because a project serving a
                closed area is genuinely incoherent — unlike a loose task.
          effects: [archive]

    - type: document
      field: status
      provenance: provisional
      evidence: >
        0 document records. The supersession chain is inferred from the 14
        PFMEA files, which express it through filenames rather than fields —
        suggestive, not evidence.
      initial: active
      terminal: [archived]
      transitions:
        - from: active
          to: superseded
          requires_index: "superseded_by is not empty"
          note: >
            The requirement is checked against the INDEX, not the file: a
            document becomes superseded when some other document declares
            `supersedes` pointing at it. You cannot mark a document
            superseded by nothing.
          effects: []
        - { from: [active, superseded], to: archived, effects: [archive] }
      snapshots:
        rule: >
          A record with `snapshot_of` set follows its parent's status and has
          no independent lifecycle. The 10 PFMEA backups are not four more
          revisions to manage.

    - type: task
      field: state
      provenance: derived
      evidence: >
        30 real tasks with real state values and a real `completedDate`.
        The only machine in this file with evidence behind it.
      initial: open
      terminal: [done, cancelled]
      transitions:
        - { from: open, to: [in-progress, blocked, deferred, done, cancelled] }
        - { from: in-progress, to: [open, blocked, deferred, done, cancelled] }
        - { from: blocked, to: [open, in-progress, deferred, cancelled] }
        - from: deferred
          to: [open, in-progress, cancelled]
          note: >
            Deferred is a decision, not an obstacle — it leaves only when you
            pick it back up or give it up. It cannot go straight to done.
        - from: [open, in-progress]
          to: blocked
          requires: [blocked_by]
          note: Blocked by nothing is not blocked.
        - from: [open, in-progress, blocked]
          to: done
          effects:
            - stamp: completed
            - unblock: "tasks listing this one in blocked_by"
          note: >
            Completing a task releases whatever it blocked — via the `blocks`
            inverse. Dependents move to `open`, never straight to done.
        - { from: [done, cancelled], to: open, note: "reopening; clears completed" }
      archive: >
        Tasks are archived in batches rather than individually — a done task
        is finished, not filed. Archiving moves them to 96.

    - type: world
      field: status
      provenance: provisional
      evidence: "1 record, never transitioned."
      initial: active
      terminal: [done, cancelled]
      note: >
        Reuses `project_status`. `on-hold` reads as dormant and `done` as
        "the story is told" — a world can be finished even though it has no
        deadline. Provisional: no real world has ever changed state.
      transitions:
        - { from: active, to: on-hold }
        - { from: on-hold, to: active }
        - from: [active, on-hold]
          to: [done, cancelled]
          guards:
            - check: "entries is empty"
              severity: warn
              message: "{n} entries still attached"
          effects: [archive]

  # --- types with no machine ---------------------------------------------
  stateless:
    types: [resource, person, organization, group, note, journal, meeting,
            world-entry, system]
    rule: >
      No status field and no transitions. They are created, edited and
      eventually archived via `archived_on` alone. A meeting does not have
      states; it happened.
    system_note: >
      System artifacts are stateless but not archived either — an audit is
      superseded by the next run and deleted, a view is edited in place. They
      are the one group with no 9N destination, which is correct: 00-09 has
      no archive counterpart and does not need one.

# -----------------------------------------------------------------------------
#  QUERY CONTRACT
# -----------------------------------------------------------------------------
#
#  What the schema GUARANTEES is answerable. This exists so the query layer is
#  defined by the schema rather than by whatever the first app happened to
#  implement — the failure mode this whole rebuild is a reaction to.
#
#  The contract cuts both ways:
#    * Anything declared here, an implementation MUST support.
#    * Anything NOT declared here is not guaranteed, and no feature may be
#      built on the assumption that it is.

query:
  # --- what a query is ---------------------------------------------------
  form: declarative-tree
  form_note: >
    A query is data, not a string. No parser beyond a tree walker, diffable
    in git, and a saved view is simply a record whose frontmatter is the
    query. A string syntax may later be added as sugar that compiles to this
    tree; the tree stays canonical.

  shape:
    from: "<core type, list of types, or '*'>"
    where: "<condition tree>"
    group_by: "<field>"
    sort: "[{ field, dir: asc|desc }]"
    limit: "<n>"
    select: "[fields] — omitted means the whole record"

  example: |
    from: document
    where:
      and:
        - { field: doc_type, in: [paystub, w2] }
        - { field: doc_date, gte: "2026-01-01" }
        - { field: attaches_to, is: null }
    group_by: issuer
    sort: [{ field: doc_date, dir: desc }]
    limit: 50

  # --- operators ---------------------------------------------------------
  operators:
    logical: [and, or, not]
    equality: [eq, ne, in, not_in]
    ordering: [gt, gte, lt, lte] # dates and numbers
    text: [contains, starts_with, ends_with]
    presence: [is] # is: null | not_null
    edge: [links_to, linked_from] # traverse a link field in either direction

  # --- special values ----------------------------------------------------
  values:
    self: >
      The record the view is embedded in. What makes one `person-hub` view
      definition serve every person instead of being copied per record.
    today: Current date, evaluated at query time.

  # --- index classes -----------------------------------------------------
  #  What the index MUST maintain. Every field below is guaranteed queryable
  #  at speed; anything omitted is a scan and must not be relied on.
  indexes:
    - class: unique
      fields: [id]
    - class: exact
      fields: [type, folder, status, state, priority, scope]
      subtypes: [doc_type, resource_type, note_type, period, entry_type, system_type]
      note: Every closed vocabulary is exact-indexed. That is what closing it buys.
    - class: range
      fields: [created, updated, doc_date, date, due, scheduled, start, end,
               met, coverage_start, coverage_end, expires, valid_until,
               week_start, week_end, filed_on, tax_year, amount, gross, net]
    - class: edge
      fields: all-link-fields
      bidirectional: true
      note: >
        Both directions of all 18 link fields. This is the index that makes
        named inverses real — without it they are just documentation.
    - class: text
      fields: [title, body, tags]
      excludes: sensitive-folders
      note: >
        Full-text over the typed zone only. Records in folders marked
        `sensitive` are indexed by metadata alone — their bodies are never
        read, so they are findable by title and never by content.

  # --- reverse traversal -------------------------------------------------
  inverses:
    storage: index-only
    rule: >
      An inverse is never written into a file. `meeting.attended` lives in the
      meeting; `person.meetings` exists only in the index. One direction is
      authored, the other is derived, and they can never disagree.
    read_only: true
    uniqueness: >
      An inverse name must be unique on its TARGET type, not globally. `area`
      receives three — `projects` from project.serves, `documents` from
      document.serves, `filed_here` from document.attaches_to — and all three
      had to be distinct even though two come from the same source type.

    by_target:
      area: [projects, documents, filed_here, plans]
      person: [meetings, issued, documents, groups]
      organization: [people, issued, documents, policies, services, certificates]
      project: [tasks, filed_here, plans]
      world: [entries, filed_here]
      document: [superseded_by, snapshots]
      task: [blocks]
      resource: [notes]
      "*": [related]

  # --- what is NOT queryable ---------------------------------------------
  excluded:
    - subject: bulk zone
      queryable: [path, filename, extension, size, embedded metadata]
      not_queryable: [fields]
      rationale: >
        Bulk-zone files have no fields. Media and tool folders are searchable
        by name and by what the file itself carries (EXIF, ID3), never by
        schema fields — because there are none to carry.

    - subject: sensitive folders
      queryable: [title, filename, type, subtype, dates]
      not_queryable: [body, extracted content]
      rationale: >
        Enforces the layout's `sensitive-not-scanned` rule at the query
        layer, so it cannot be bypassed by building a search feature.

    - subject: record body
      queryable: [full-text presence]
      not_queryable: [structure, headings, embedded blocks]
      rationale: >
        The body is prose, never parsed for data. Querying its structure
        would make it a second schema competing with frontmatter — which is
        exactly how the previous system drifted.

# -----------------------------------------------------------------------------
#  IMPORT — where required fields come from for records that predate the schema
# -----------------------------------------------------------------------------
#
#  Measured 2026-08-17 against 88 real records (129 live files, sensitive zones
#  excluded, templates excluded). The counts are what each rule actually has to
#  cover, not estimates. Every field below was found missing by that test —
#  none of it was anticipated in the original design.

import:
  derived:
    - field: "*.id"
      source: slugify(filename)
      covers: 88
      note: >
        Generated for every record. Not a defect — no file-based system
        carries an explicit id, which is exactly why one has to be minted
        rather than read.

    - field: meeting.date
      source: date part of `created`
      covers: 14
      note: >
        Real meetings carry only `created`. Usually the same day, but not
        always — a meeting written up the next morning has a true date and a
        later `created`. The schema keeps them distinct and seeds one from
        the other rather than collapsing them the way the old tool did. Now
        that `created` is a `datetime`, this is a truncation and not a copy:
        take the date part in the vault's local zone, not in UTC, or a
        meeting written up late in the evening moves to tomorrow.

    - field: journal.date
      source: filename
      covers: 6
      note: Dailies are `YYYY-MM-DD-[W]WW-DDD`; weeklies are `YYYY-Www`.

    - field: journal.period
      source: legacy `type` value (daily | weekly)
      covers: 6

    - field: note.note_type
      source: constant `note`
      covers: 17

    - field: task.type
      source: "`#task` tag"
      covers: 30
      note: Tasks carry no type field at all; the tag is the only signal.

  manual:
    description: >
      Required fields no rule can derive. This list is the entire human cost
      of the import — 21 decisions, of which only 6 are blocking.
    fields:
      - { field: project.scope, count: 4, severity: error }
      - { field: resource.resource_type, count: 2, severity: error }
      - { field: person.relationship, count: 15, severity: warn }

  binary_survey:
    measured: 2026-08-17
    corpus: 114
    method: >
      Filenames, extensions and containing folders only. No file contents
      opened; five sensitive directories excluded from the walk entirely.
    findings:
      - { defect: container-attached-documents, count: 63,
          fix: "`attaches_to` field + container-relative routing override" }
      - { defect: work-products-with-no-category, count: 35,
          fix: "doc_type += analysis, dataset, report, register; category 39" }
      - { defect: quote-conflated-with-invoice, count: 4,
          fix: "doc_type += quote" }
      - { defect: certificate-missing, count: 1,
          fix: "doc_type += certificate" }
      - { defect: manual-version-backups, count: 10,
          fix: "`snapshot_of` field — 14 files were only 4 revisions" }
      - { defect: attachment-bundles-in-typed-zone, count: 13,
          fix: "layout: named subfolders permitted inside containers" }
      - { defect: routing-key-collision, count: 1,
          fix: "system_type `report` renamed `audit`" }
      - { defect: duplicate-files, count: 2,
          fix: "none needed — rule one-item-one-place already covers it" }
    confirmed_correct:
      values: [spec, paystub, resume, cover-letter, offer-letter, claim,
               medical-record, insurance-policy, correspondence]
      note: >
        These routed cleanly with no resistance across 40-odd real files.
        Everything else in doc_type remains provisional — invented, and not
        yet contradicted by anything.

  conforms_already:
    types: [person, world, world-entry]
    note: >
      Nothing missing beyond the generated id. `person` only reached this
      state because the reality test moved `relationship` from required to
      required-on-create and dropped `full_name` — before those two edits it
      failed 15 of 15.

# -----------------------------------------------------------------------------
#  VALIDATION
# -----------------------------------------------------------------------------

validation:
  error:
    - missing-required-field
    - value-outside-closed-vocabulary
    - unresolvable-link
    - malformed-date
    - duplicate-id
    - id-changed # `id` is immutable; a changed one is corruption, not an edit
    - wrong-folder # record's type/subtype not accepted by its category
    - container-id-mismatch # project/area/world record id != its folder id
    - subtype-field-on-wrong-subtype # e.g. `gross` on a deed
    - world-entry-without-world # `appears_in` missing or unresolvable
    - illegal-transition # a state change no machine permits
    - transition-requirement-unmet # e.g. `done` with no `result`
    - blocked-task-without-blocker # `blocked` and `blocked_by` empty
    - area-closed-with-active-projects
    - superseded-without-successor # nothing declares `supersedes` at it

  warn:
    - missing-payload # `file:` points at a binary that isn't there
    - link-to-archived-record
    - empty-field-normally-filled
    - finished-project-without-result
    - person-without-relationship # required on create, warned on imports
    - organization-as-text # a person's employer that has no record yet
    - project-done-with-open-tasks
    - world-archived-with-entries
    - terminal-record-not-archived # done/cancelled but still live

  info:
    - orphan # no links in either direction
    - stale # untouched beyond a threshold
    - untyped-binary # a file in the typed zone with no stub
    - first-instance-of-provisional # triggers the provenance review

# -----------------------------------------------------------------------------
#  OPEN QUESTIONS — known gaps, deliberately not guessed at
# -----------------------------------------------------------------------------

open_questions:
  - id: folder-storage
    raised: 2026-08-19
    question: >
      Is `folder` a stored derived column on the record, or a view computed
      from the routing rules on read?
    evidence: >
      `query.indexes` guarantees `folder` is exact-indexed, and
      `lifecycle.archive` preserves `jd` — but no type declares either as a
      field, because both are DERIVED: routing computes them from `type`,
      the subtype value, and `attaches_to`. In a file-based vault the
      question could not arise, since the path was the storage.
    why_unresolved: >
      Both answers are defensible and the deciding evidence does not exist
      yet. Stored is a cache, and a cache of a pure function of three columns
      is only worth it if reads are hot and re-derivation is slow — neither
      of which is measurable before records exist. Computed cannot go stale,
      but a container-relative route resolves against another RECORD rather
      than against the layout, so the view has to join, and `world-entry`
      routes through its world.
    unblocks: nothing today — the router does not exist until phase 2
    decide_by: >
      Phase 4. The projector has to write the real path anyway, so it is the
      first thing that has an opinion worth having.

  - id: resource-status
    raised: 2026-08-17
    question: Should `resource` carry a status field?
    evidence: >
      3 of 29 real resources carry one — `stub`, `in-progress`, `done`. The
      type has no such field, so those values would be dropped on import.
    why_unresolved: >
      Thin and mixed evidence. `stub` describes completeness, `in-progress`
      describes work, `done` could mean either — three records is not enough
      to tell which axis is real, and inventing a fourth status vocabulary on
      a guess is exactly the habit this schema exists to break.
    unblocks: import of 3 records
    decide_by: first real use of a `plan` resource, which will have a status or not
